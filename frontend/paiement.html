<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0806" media="(prefers-color-scheme: dark)">
  <title>Paiement sécurisé — LOCATION</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/components.css">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div class="page page--checkout">

    <!-- HEADER -->
    <header class="page-header">
      <a href="abonnement.html" class="page-header__back" aria-label="Retour">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
      <span class="page-title" style="font-size: 18px;">Paiement sécurisé</span>
      <span class="page-header__lock" aria-label="Paiement sécurisé">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </span>
    </header>

    <main>

      <!-- RÉCAPITULATIF DE L'OFFRE -->
      <section class="order-summary" aria-label="Récapitulatif de la commande">
        <span class="order-summary__label">Votre commande</span>
        <h2 class="order-summary__name" id="plan-name">Visibilité Active</h2>
        <div class="order-summary__price">
          <span class="order-summary__amount" id="plan-price">5 000</span>
          <span class="order-summary__currency">FCFA</span>
          <span class="order-summary__duration" id="plan-duration">/ 30 jours</span>
        </div>
      </section>

      <!-- CHOIX DU MOYEN DE PAIEMENT -->
      <h2 class="checkout-section-title">Choisissez votre moyen de paiement</h2>

      <div class="payment-methods" role="radiogroup" aria-label="Moyens de paiement">

        <!-- MTN Mobile Money -->
        <label class="payment-method">
          <input type="radio" name="payment" value="mtn" data-requires-phone="true" checked>
          <span class="payment-method__icon payment-method__icon--mtn">MTN</span>
          <span class="payment-method__info">
            <span class="payment-method__name">MTN Mobile Money</span>
            <span class="payment-method__desc">MoMo</span>
          </span>
          <span class="payment-method__radio" aria-hidden="true"></span>
        </label>

        <!-- Moov Money -->
        <label class="payment-method">
          <input type="radio" name="payment" value="moov" data-requires-phone="true">
          <span class="payment-method__icon payment-method__icon--moov">Moov</span>
          <span class="payment-method__info">
            <span class="payment-method__name">Moov Money</span>
            <span class="payment-method__desc">Flooz</span>
          </span>
          <span class="payment-method__radio" aria-hidden="true"></span>
        </label>

        <!-- Celtiis Cash -->
        <label class="payment-method">
          <input type="radio" name="payment" value="celtiis" data-requires-phone="true">
          <span class="payment-method__icon payment-method__icon--celtiis">Celtiis</span>
          <span class="payment-method__info">
            <span class="payment-method__name">Celtiis Cash</span>
            <span class="payment-method__desc">Mobile</span>
          </span>
          <span class="payment-method__radio" aria-hidden="true"></span>
        </label>

        <!-- Carte bancaire -->
        <label class="payment-method">
          <input type="radio" name="payment" value="card" data-requires-phone="false">
          <span class="payment-method__icon payment-method__icon--card">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
              <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
          </span>
          <span class="payment-method__info">
            <span class="payment-method__name">Carte bancaire</span>
            <span class="payment-method__desc">Visa / Mastercard</span>
          </span>
          <span class="payment-method__radio" aria-hidden="true"></span>
        </label>

      </div>

      <!-- CHAMP TÉLÉPHONE (visible si Mobile Money) -->
      <div class="phone-group form-group" id="phone-group">
        <label for="phone" class="form-label">Numéro Mobile Money</label>
        <input type="tel" id="phone" name="phone" class="form-input"
               placeholder="+229 XX XX XX XX" autocomplete="tel"
               inputmode="tel">
        <small class="form-hint">Vous recevrez une notification pour confirmer le paiement.</small>
      </div>

    </main>
  </div>

  <!-- BARRE D'ACTION FIXE -->
  <div class="payment-bar">
    <div class="payment-bar__total">
      <span class="payment-bar__total-label">Total à payer</span>
      <span class="payment-bar__total-amount">
        <span id="total-amount">5 000</span> FCFA
      </span>
    </div>

    <button type="button" class="btn btn--primary btn--lg" id="pay-btn">
      Payer maintenant
    </button>

    <p class="payment-bar__reassurance">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Paiement 100% sécurisé. Aucune donnée bancaire n'est stockée sur nos serveurs.
    </p>
  </div>

  <!-- Script inline temporaire (à déplacer dans js/paiement.js plus tard) -->
<script>
  (function () {
    'use strict';

    /* ---------------------------------------------------
       1. PLANS DISPONIBLES
       --------------------------------------------------- */
    var PLANS = {
      'visibilite-semaine':    { name: 'Visibilité Semaine',   price: '2 000',  duration: '/ 7 jours',  type: 'visibility' },
      'visibilite-active':     { name: 'Visibilité Active',    price: '5 000',  duration: '/ 30 jours', type: 'visibility' },
      'visibilite-premium':    { name: 'Visibilité Premium',   price: '10 000', duration: '/ 30 jours', type: 'visibility' },
      'gestion-gratuit':       { name: 'Gestion Gratuit',      price: '0',      duration: '/ mois',     type: 'management' },
      'gestion-pro-essentiel': { name: 'Pro Essentiel',        price: '1 000',  duration: '/ mois',     type: 'management' },
      'gestion-pro-confort':   { name: 'Pro Confort',          price: '5 000',  duration: '/ mois',     type: 'management' }
    };

    /* ---------------------------------------------------
       2. LECTURE DU PARAMÈTRE ?plan=xxx
       --------------------------------------------------- */
    var params  = new URLSearchParams(window.location.search);
    var planKey = params.get('plan') || 'visibilite-active';
    var plan    = PLANS[planKey] || PLANS['visibilite-active'];

    var nameEl     = document.getElementById('plan-name');
    var priceEl    = document.getElementById('plan-price');
    var durationEl = document.getElementById('plan-duration');
    var totalEl    = document.getElementById('total-amount');
    var payBtn     = document.getElementById('pay-btn');

    if (nameEl)     nameEl.textContent     = plan.name;
    if (priceEl)    priceEl.textContent    = plan.price;
    if (durationEl) durationEl.textContent = plan.duration;
    if (totalEl)    totalEl.textContent    = plan.price;

    // Cas spécial : plan gratuit → pas de paiement nécessaire
    if (plan.price === '0' && payBtn) {
      payBtn.textContent = 'Activer ma gestion';
    }

    /* ---------------------------------------------------
       3. BASCULE CHAMP TÉLÉPHONE SELON LE MOYEN
       --------------------------------------------------- */
    var phoneGroup = document.getElementById('phone-group');
    var phoneInput = document.getElementById('phone');
    var radios     = document.querySelectorAll('input[name="payment"]');

    function updatePhoneVisibility() {
      // ✅ CORRECTION : plus de "d" parasite
      var selected = document.querySelector('input[name="payment"]:checked');
      var needsPhone = selected && selected.getAttribute('data-requires-phone') === 'true';
      if (!phoneGroup) return;

      if (needsPhone) {
        phoneGroup.removeAttribute('hidden');
        if (phoneInput) phoneInput.setAttribute('required', 'required');
      } else {
        phoneGroup.setAttribute('hidden', '');
        if (phoneInput) {
          phoneInput.removeAttribute('required');
          phoneInput.value = '';
        }
      }
    }

    radios.forEach(function (r) {
      r.addEventListener('change', updatePhoneVisibility);
    });

    updatePhoneVisibility();

    /* ---------------------------------------------------
       4. ACTION DU BOUTON PAYER (stub)
       --------------------------------------------------- */
    if (payBtn) {
      payBtn.addEventListener('click', function () {
        var selected = document.querySelector('input[name="payment"]:checked');
        if (!selected) return;

        // Cas gratuit : pas besoin de moyen de paiement
        if (plan.price === '0') {
          alert('Activation de ' + plan.name + ' en cours…');
          return;
        }

        var method = selected.value;
        var needsPhone = selected.getAttribute('data-requires-phone') === 'true';

        if (needsPhone && (!phoneInput || !phoneInput.value.trim())) {
          alert('Veuillez saisir votre numéro Mobile Money.');
          if (phoneInput) phoneInput.focus();
          return;
        }

        // TODO : remplacer par l'appel API de paiement
        alert(
          'Paiement en attente de confirmation.\n\n' +
          'Plan : ' + plan.name + '\n' +
          'Montant : ' + plan.price + ' FCFA\n' +
          'Méthode : ' + method + '\n' +
          'Type : ' + plan.type
        );
      });
    }

  })();
</script>

  <script src="js/app.js" defer></script>
</body>
</html>
