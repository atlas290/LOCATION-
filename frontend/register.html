<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0806" media="(prefers-color-scheme: dark)">
  <title>Inscription — LOCATION</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/components.css">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <style>
    .auth-page { min-height: 100vh; display: flex; flex-direction: column; padding: 16px; background: var(--bg-base); }
    .auth-header { display: flex; justify-content: space-between; align-items: center; height: 56px; margin-bottom: 16px; }
    .auth-header__back { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; color: var(--text-primary); }
    .auth-header__back:active { background: var(--bg-subtle); }
    .auth-logo { height: 28px; width: auto; }
    .auth-card { width: 100%; max-width: 460px; margin: 0 auto; padding: 0 8px; }
    .auth-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; color: var(--text-primary); }
    .auth-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-weight: 600; font-size: 13px; color: var(--text-primary); }
    .form-group input, .form-group select { padding: 14px 16px; min-height: 48px; border: 1px solid var(--border); border-radius: var(--radius-md); font: inherit; font-size: 16px; background: var(--bg-subtle); color: var(--text-primary); transition: border-color 150ms ease; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--text-primary); }
    .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .form-error { color: #b91c1c; background: rgba(220, 38, 38, 0.08); border-left: 3px solid #dc2626; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-secondary); }
    .auth-footer a { color: var(--text-primary); text-decoration: none; font-weight: 600; }
    .btn--full { width: 100%; min-height: 52px; font-size: 15px; }
    [data-theme="dark"] .auth-logo--light { display: none; }
    [data-theme="dark"] .auth-logo--dark { display: block; }
    .auth-logo--dark { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .auth-logo--light { display: none; }
      :root:not([data-theme="light"]) .auth-logo--dark { display: block; }
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <!-- HEADER -->
    <header class="auth-header">
      <a href="index.html" class="auth-header__back" aria-label="Retour">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <a href="index.html">
        <img class="auth-logo auth-logo--light" src="assets/images/logo-noir.png" alt="LOCATION">
        <img class="auth-logo auth-logo--dark" src="assets/images/logo-blanc.png" alt="LOCATION">
      </a>
      <div style="width: 44px;"></div>
    </header>

    <div class="auth-card">
      <h1 class="auth-title">Créer un compte</h1>
      <p class="auth-subtitle">Rejoignez LOCATION en 30 secondes.</p>

      <div id="form-error" class="form-error" role="alert" hidden></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="reg-fullname">Nom complet</label>
          <input type="text" id="reg-fullname" name="full_name" autocomplete="name" placeholder="Ex: Jean Dupont" required />
        </div>

        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" autocomplete="email" placeholder="votre@email.com" required />
        </div>

        <div class="form-group">
          <label for="reg-phone">Téléphone</label>
          <input type="tel" id="reg-phone" name="phone" autocomplete="tel" placeholder="+229 XX XX XX XX" required />
        </div>

        <div class="form-group">
          <label for="reg-password">Mot de passe</label>
          <input type="password" id="reg-password" name="password" autocomplete="new-password" minlength="8" pattern="(?=.*[a-zA-Z])(?=.*\d).{8,}" placeholder="Minimum 8 caractères" required />
          <small class="form-hint">Minimum 8 caractères, dont 1 lettre et 1 chiffre.</small>
        </div>

        <div class="form-group">
          <label for="reg-role">Je suis</label>
          <select id="reg-role" name="role" required>
            <option value="locataire">Locataire</option>
            <option value="proprietaire">Propriétaire</option>
            <option value="agence">Agence immobilière</option>
          </select>
        </div>

        <button type="submit" class="btn btn--primary btn--full">S'inscrire</button>
      </form>

      <p class="auth-footer">
        Déjà un compte ? <a href="login.html">Se connecter</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
