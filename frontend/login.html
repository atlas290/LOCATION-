<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — LOCATION</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; background: var(--bg-base); }
    .auth-card { width: 100%; max-width: 420px; padding: 2rem; background: var(--bg-elevated); border-radius: var(--radius-lg); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); }
    .auth-card h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
    .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: .4rem; }
    .form-group label { font-weight: 500; font-size: .95rem; }
    .form-group input, .form-group select { padding: .75rem .9rem; border: 1px solid var(--border); border-radius: var(--radius-md); font: inherit; background: var(--bg-base); color: inherit; }
    .form-group input:focus, .form-group select:focus { outline: 2px solid var(--accent-cta); outline-offset: 1px; border-color: var(--accent-cta); }
    .form-error { color: #b91c1c; background: rgba(220, 38, 38, 0.08); border-left: 3px solid #dc2626; padding: .6rem .8rem; border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; }
    .form-notice { color: var(--text-muted); background: var(--bg-subtle); border-left: 3px solid var(--accent-cta); padding: .6rem .8rem; border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; }
    .auth-footer { text-align: center; margin-top: 1.2rem; font-size: .9rem; color: var(--text-muted); }
    .auth-footer a { color: var(--accent-cta); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
    .btn--full { width: 100%; }
  </style>
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1>Se connecter</h1>
      <div id="form-notice" class="form-notice" role="status" hidden></div>
      <div id="form-error" class="form-error" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn--primary btn--full">Se connecter</button>
      </form>

      <p class="auth-footer">
        Pas encore de compte ? <a href="register.html">Créer un compte</a>
      </p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
