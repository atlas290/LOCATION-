<!DOCTYPE html>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();

</head>

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"/></svg>
            <span>Mode Sombre</span>

            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Déconnexion -->
        <a href="index.html" class="settings-item settings-item--danger" style="border-bottom: none; margin-top: 16px;">
          <div class="settings-item__left">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

      <span>Profil</span>
    </a>

  <script src="js/app.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var toggle = document.getElementById('dark-mode-toggle');
      var currentTheme = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (currentTheme === 'dark') toggle.checked = true;
    });
  </script>

</html>
